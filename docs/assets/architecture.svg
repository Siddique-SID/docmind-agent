<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="980" height="360" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">DocMind Agent architecture</text>

  <!-- Ingestion -->
  <rect x="30" y="90" width="170" height="90" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="115" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#0969da">Documents</text>
  <text x="115" y="146" text-anchor="middle" font-size="12" fill="#24292f">Markdown pages</text>
  <text x="115" y="164" text-anchor="middle" font-size="12" fill="#24292f">(MIT, pinned)</text>

  <rect x="250" y="90" width="170" height="90" rx="10" fill="#fff8c5" stroke="#9a6700"/>
  <text x="335" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6700">Ingest</text>
  <text x="335" y="146" text-anchor="middle" font-size="12" fill="#24292f">Overlapping chunks</text>
  <text x="335" y="164" text-anchor="middle" font-size="12" fill="#24292f">120 words, 20 overlap</text>

  <!-- Retrieval stack -->
  <rect x="470" y="50" width="200" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="570" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f37">TF-IDF retriever</text>
  <text x="570" y="98" text-anchor="middle" font-size="12" fill="#24292f">offline, default</text>

  <rect x="470" y="135" width="200" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="570" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f37">Embedding retriever</text>
  <text x="570" y="183" text-anchor="middle" font-size="12" fill="#24292f">needs API key</text>

  <rect x="470" y="220" width="200" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="570" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f37">Hybrid (RRF)</text>
  <text x="570" y="268" text-anchor="middle" font-size="12" fill="#24292f">fuses both rankings</text>

  <!-- Answer -->
  <rect x="730" y="90" width="220" height="90" rx="10" fill="#fbefff" stroke="#8250df"/>
  <text x="840" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#8250df">Answer agent</text>
  <text x="840" y="146" text-anchor="middle" font-size="12" fill="#24292f">Claude with citations</text>
  <text x="840" y="164" text-anchor="middle" font-size="12" fill="#24292f">or extractive (offline)</text>

  <!-- Evaluation gate -->
  <rect x="250" y="250" width="170" height="80" rx="10" fill="#ffebe9" stroke="#cf222e"/>
  <text x="335" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#cf222e">Evaluation</text>
  <text x="335" y="300" text-anchor="middle" font-size="12" fill="#24292f">recall@3, MRR</text>
  <text x="335" y="318" text-anchor="middle" font-size="12" fill="#24292f">CI fails below 0.80</text>

  <!-- arrows -->
  <line x1="200" y1="135" x2="248" y2="135" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="135" x2="468" y2="85" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="135" x2="468" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="135" x2="468" y2="255" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="85" x2="728" y2="125" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="170" x2="728" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="255" x2="728" y2="160" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="335" y1="180" x2="335" y2="248" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="345" y="222" font-size="11" fill="#cf222e">questions + expected docs</text>
</svg>
